<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 740" width="960" height="740" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">nvecd プロセスのレイヤー構成</title>
  <desc id="dsc">上から順に、クライアント・トランスポート・ディスパッチ・エンジンとストア・永続化の 5 つの帯が積み重なっています。リクエストは TCP、Unix ソケット、または HTTP で入り、コマンドへ解釈されてハンドラへ振り分けられ、類似度エンジンを通してストアに届きます。エンジンは ANN インデックスを所有し、ベクトル側とイベント側の両方を読みます。右の列には、設定・実行時変数・2 つのバックグラウンドスケジューラ・エラー型・非所有のハンドラコンテキストといった、すべての層を横断する要素をまとめています。</desc>

  <style>
    .bg    { fill:#f7f5f1 }
    .grp   { fill:#edeae4 }
    .chip  { fill:#ffffff; stroke:#d7d4cd }
    .card  { fill:#ffffff; stroke:#3f6b8a }
    .alt   { fill:#ffffff; stroke:#8a6a1f }
    .rule  { fill:none; stroke:#b8b4ac; stroke-width:1 }
    .lnn   { fill:none; stroke:#b8b4ac; stroke-width:1.4 }
    .ahn   { fill:#b8b4ac }
    text   { font-family:Inter,"Helvetica Neue","Hiragino Sans","Noto Sans JP",Arial,sans-serif; fill:#1f2328 }
    .h     { font-size:12.5px }
    .lbl   { font-size:11px; fill:#6e7781; letter-spacing:.06em }
    .s     { font-size:10.5px; fill:#6e7781 }
    .mono  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#3f6b8a }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117} .grp{fill:#12171d}
      .chip{fill:#161b22;stroke:#30363d} .card{fill:#161b22;stroke:#7fb3d5} .alt{fill:#161b22;stroke:#d9b45c}
      .rule{stroke:#484f58} .lnn{stroke:#484f58} .ahn{fill:#484f58}
      .mono{fill:#7fb3d5}
      text{fill:#e6edf3} .lbl{fill:#8b949e} .s{fill:#8b949e}
    }
  </style>

  <defs>
    <marker id="c" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ahn" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="740" rx="12"/>

  <path class="lnn" d="M 36 44 V 688" marker-end="url(#c)"/>
  <text class="lbl" x="22" y="366" text-anchor="middle" transform="rotate(-90 22 366)">リクエストは上から入り、下へ進む</text>

  <rect class="grp" x="52" y="32" width="672" height="86" rx="8"/>
  <text class="lbl" x="68" y="54">クライアント</text>
  <rect class="chip" x="68" y="64" width="148" height="40" rx="5"/>
  <text class="h" x="142" y="82" text-anchor="middle">TCP クライアント</text>
  <text class="s" x="142" y="98" text-anchor="middle">既定ポート 11017</text>
  <rect class="chip" x="232" y="64" width="148" height="40" rx="5"/>
  <text class="h" x="306" y="82" text-anchor="middle">HTTP クライアント</text>
  <text class="s" x="306" y="98" text-anchor="middle">HTTP 越しの JSON</text>
  <rect class="chip" x="396" y="64" width="148" height="40" rx="5"/>
  <text class="mono" x="470" y="82" text-anchor="middle">nvecd-cli</text>
  <text class="s" x="470" y="98" text-anchor="middle">対話シェル</text>
  <rect class="chip" x="560" y="64" width="148" height="40" rx="5"/>
  <text class="mono" x="634" y="82" text-anchor="middle">libnvecdclient</text>
  <text class="s" x="634" y="98" text-anchor="middle">C / C++ ライブラリ</text>

  <rect class="grp" x="52" y="136" width="672" height="86" rx="8"/>
  <text class="lbl" x="68" y="158">トランスポート</text>
  <rect class="chip" x="68" y="168" width="148" height="40" rx="5"/>
  <text class="h" x="142" y="186" text-anchor="middle">ConnectionAcceptor</text>
  <text class="s" x="142" y="202" text-anchor="middle">TCP と Unix ソケット</text>
  <rect class="chip" x="232" y="168" width="148" height="40" rx="5"/>
  <text class="h" x="306" y="186" text-anchor="middle">IoReactor</text>
  <text class="s" x="306" y="202" text-anchor="middle">epoll または kqueue</text>
  <rect class="chip" x="396" y="168" width="148" height="40" rx="5"/>
  <text class="h" x="470" y="186" text-anchor="middle">HttpServer</text>
  <text class="s" x="470" y="202" text-anchor="middle">JSON ルートと CORS</text>
  <rect class="chip" x="560" y="168" width="148" height="40" rx="5"/>
  <text class="h" x="634" y="186" text-anchor="middle">RateLimiter</text>
  <text class="s" x="634" y="202" text-anchor="middle">IP 単位の流量制限</text>

  <rect class="grp" x="52" y="240" width="672" height="144" rx="8"/>
  <text class="lbl" x="68" y="262">ディスパッチ</text>
  <rect class="chip" x="68" y="272" width="148" height="40" rx="5"/>
  <text class="h" x="142" y="290" text-anchor="middle">ThreadPool</text>
  <text class="s" x="142" y="306" text-anchor="middle">リクエスト処理を実行</text>
  <rect class="chip" x="232" y="272" width="148" height="40" rx="5"/>
  <text class="h" x="306" y="290" text-anchor="middle">CommandParser</text>
  <text class="s" x="306" y="306" text-anchor="middle">1 行を Command に</text>
  <rect class="chip" x="396" y="272" width="148" height="40" rx="5"/>
  <text class="h" x="470" y="290" text-anchor="middle">FilterParser</text>
  <text class="s" x="470" y="306" text-anchor="middle">メタデータの絞り込み式</text>
  <rect class="chip" x="560" y="272" width="148" height="40" rx="5"/>
  <text class="h" x="634" y="290" text-anchor="middle">RequestDispatcher</text>
  <text class="s" x="634" y="306" text-anchor="middle">TCP コマンドを振り分け</text>

  <text class="lbl" x="68" y="344">ハンドラ</text>
  <rect class="chip" x="132" y="326" width="86" height="26" rx="5"/>
  <text class="mono" x="175" y="343" text-anchor="middle">admin</text>
  <rect class="chip" x="230" y="326" width="86" height="26" rx="5"/>
  <text class="mono" x="273" y="343" text-anchor="middle">cache</text>
  <rect class="chip" x="328" y="326" width="86" height="26" rx="5"/>
  <text class="mono" x="371" y="343" text-anchor="middle">debug</text>
  <rect class="chip" x="426" y="326" width="86" height="26" rx="5"/>
  <text class="mono" x="469" y="343" text-anchor="middle">dump</text>
  <rect class="chip" x="524" y="326" width="86" height="26" rx="5"/>
  <text class="mono" x="567" y="343" text-anchor="middle">info</text>
  <rect class="chip" x="622" y="326" width="86" height="26" rx="5"/>
  <text class="mono" x="665" y="343" text-anchor="middle">variable</text>

  <text class="s" x="68" y="372">HttpServer は RequestDispatcher を経由せず、HandlerContext を通じて同じハンドラに届きます。</text>

  <rect class="grp" x="52" y="402" width="672" height="190" rx="8"/>
  <text class="lbl" x="68" y="424">エンジンとストア</text>

  <rect class="card" x="68" y="434" width="380" height="54" rx="6"/>
  <text class="h" x="84" y="456">SimilarityEngine</text>
  <text class="s" x="84" y="474">events · vectors · fusion</text>
  <rect class="card" x="256" y="442" width="176" height="38" rx="5"/>
  <text class="h" x="272" y="458">AnnIndex</text>
  <text class="mono" x="272" y="474">flat / hnsw / ivf</text>

  <rect class="chip" x="464" y="434" width="244" height="54" rx="6"/>
  <text class="h" x="480" y="456">SimilarityCacheController</text>
  <text class="s" x="480" y="474">キャッシュを保持し公開する</text>

  <rect class="alt" x="68" y="502" width="148" height="76" rx="5"/>
  <text class="h" x="142" y="522" text-anchor="middle">EventStore</text>
  <text class="s" x="142" y="540" text-anchor="middle">コンテキストごとに</text>
  <text class="s" x="142" y="556" text-anchor="middle">リングバッファ、</text>
  <text class="s" x="142" y="572" text-anchor="middle">重複と状態キャッシュ</text>
  <rect class="alt" x="232" y="502" width="148" height="76" rx="5"/>
  <text class="h" x="306" y="522" text-anchor="middle">CoOccurrenceIndex</text>
  <text class="s" x="306" y="540" text-anchor="middle">同じコンテキストに</text>
  <text class="s" x="306" y="556" text-anchor="middle">現れた回数を保持し、</text>
  <text class="s" x="306" y="572" text-anchor="middle">時間で減衰する</text>
  <rect class="card" x="396" y="502" width="148" height="76" rx="5"/>
  <text class="h" x="470" y="522" text-anchor="middle">VectorStore</text>
  <text class="s" x="470" y="540" text-anchor="middle">連続領域にまとめて</text>
  <text class="s" x="470" y="556" text-anchor="middle">保持し、SIMD カーネル</text>
  <text class="s" x="470" y="572" text-anchor="middle">で探索する</text>
  <rect class="card" x="560" y="502" width="148" height="76" rx="5"/>
  <text class="h" x="634" y="522" text-anchor="middle">MetadataStore</text>
  <text class="s" x="634" y="540" text-anchor="middle">項目ごとのメタデータ</text>
  <text class="s" x="634" y="556" text-anchor="middle">絞り込み付きの</text>
  <text class="s" x="634" y="572" text-anchor="middle">SIM / SIMV を支える</text>

  <rect class="grp" x="52" y="610" width="672" height="86" rx="8"/>
  <text class="lbl" x="68" y="632">永続化</text>
  <rect class="chip" x="68" y="642" width="148" height="40" rx="5"/>
  <text class="h" x="142" y="660" text-anchor="middle">ForkSnapshotWriter</text>
  <text class="s" x="142" y="676" text-anchor="middle">fork でコピーを凍結</text>
  <rect class="chip" x="232" y="642" width="148" height="40" rx="5"/>
  <text class="h" x="306" y="660" text-anchor="middle">SnapshotSession</text>
  <text class="s" x="306" y="676" text-anchor="middle">1 回の保存を完了</text>
  <rect class="chip" x="396" y="642" width="148" height="40" rx="5"/>
  <text class="h" x="470" y="660" text-anchor="middle">WriteAheadLog</text>
  <text class="s" x="470" y="676" text-anchor="middle">保存以降の書き込み</text>
  <rect class="chip" x="560" y="642" width="148" height="40" rx="5"/>
  <text class="h" x="634" y="660" text-anchor="middle">起動時のリカバリ</text>
  <text class="s" x="634" y="676" text-anchor="middle">snapshot の次に WAL</text>

  <rect class="grp" x="740" y="32" width="196" height="664" rx="8"/>
  <text class="lbl" x="756" y="54">全レイヤーに横断</text>

  <text class="h" x="756" y="88">Config</text>
  <text class="s" x="756" y="106">起動時に 1 度だけ読み</text>
  <text class="s" x="756" y="122">込み、どの層も同じ</text>
  <text class="s" x="756" y="138">オブジェクトを見る</text>
  <path class="rule" d="M 756 158 H 920"/>

  <text class="h" x="756" y="186">RuntimeVariableManager</text>
  <text class="s" x="756" y="204">SET / SHOW VARIABLES で</text>
  <text class="s" x="756" y="220">一部の設定を再起動なしで</text>
  <text class="s" x="756" y="236">変更する</text>
  <path class="rule" d="M 756 256 H 920"/>

  <text class="h" x="756" y="284">SnapshotScheduler</text>
  <text class="s" x="756" y="302">一定間隔でスナップ</text>
  <text class="s" x="756" y="318">ショットを書き出す。下の</text>
  <text class="s" x="756" y="334">ForkSnapshotWriter を使う</text>
  <path class="rule" d="M 756 354 H 920"/>

  <text class="h" x="756" y="382">DecayScheduler</text>
  <text class="s" x="756" y="400">共起スコアを時間で減衰</text>
  <text class="s" x="756" y="416">させ、無視できるものを</text>
  <text class="s" x="756" y="432">刈り取る</text>
  <path class="rule" d="M 756 452 H 920"/>

  <text class="h" x="756" y="480">Expected と Error</text>
  <text class="s" x="756" y="498">失敗しうる呼び出しは値か</text>
  <text class="s" x="756" y="514">エラーコードを返す。例外は</text>
  <text class="s" x="756" y="530">層をまたがない</text>
  <path class="rule" d="M 756 550 H 920"/>

  <text class="h" x="756" y="578">HandlerContext</text>
  <text class="s" x="756" y="596">各ハンドラに渡される、</text>
  <text class="s" x="756" y="612">ストアへの非所有の</text>
  <text class="s" x="756" y="628">ビュー</text>

  <text class="s" x="480" y="720" text-anchor="middle">ここに描いたものはすべて 1 プロセス内です。例外は、スナップショットを書くために ForkSnapshotWriter が fork する子プロセスだけです。</text>
</svg>
