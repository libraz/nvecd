<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 724" width="900" height="724" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">The ordered write path of a single EVENT command</title>
  <desc id="dsc">Five stacked bands follow one EVENT command from the wire to the reply. The command is parsed and passes the auth and snapshot gates before an exclusive write gate is taken. The event store then resolves the timestamp, forces a DEL score to zero, validates, and probes a dedup cache chosen by verb: a time window for ADD, the last value for SET, a deletion flag for DEL. A duplicate stops there. Otherwise the WAL record is appended before any store is touched, and only then does the event reach the per-context ring buffer and the co-occurrence index. The last band invalidates the similarity cache for the item and replies.</desc>

  <style>
    .bg    { fill:#f7f5f1 }
    .grp   { fill:#edeae4 }
    .chip  { fill:#ffffff; stroke:#d7d4cd }
    .alt   { fill:#ffffff; stroke:#8a6a1f }
    .ln2   { fill:none; stroke:#8a6a1f; stroke-width:1.4 }
    .ah2   { fill:#8a6a1f }
    text   { font-family:Inter,"Helvetica Neue","Hiragino Sans","Noto Sans JP",Arial,sans-serif; fill:#1f2328 }
    .lbl   { font-size:11px; fill:#6e7781; letter-spacing:.06em }
    .s     { font-size:10.5px; fill:#6e7781 }
    .warnt { fill:#a3401f }
    .mono  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#8a6a1f }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117} .grp{fill:#12171d}
      .chip{fill:#161b22;stroke:#30363d} .alt{fill:#161b22;stroke:#d9b45c}
      .ln2{stroke:#d9b45c} .ah2{fill:#d9b45c} .mono{fill:#d9b45c}
      text{fill:#e6edf3} .lbl{fill:#8b949e} .s{fill:#8b949e} .warnt{fill:#e08a68}
    }
  </style>

  <defs>
    <marker id="b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="900" height="724" rx="12"/>

  <rect class="grp" x="24" y="48" width="852" height="76" rx="8"/>
  <text class="lbl" x="38" y="68">PARSE AND GATE</text>
  <text class="s" x="236" y="68">the HTTP handler builds the same Command and calls ApplyWrite directly</text>
  <rect class="alt" x="38" y="78" width="264" height="32" rx="5"/>
  <text class="mono" x="170" y="98" text-anchor="middle">EVENT &lt;ctx&gt; ADD|SET|DEL &lt;id&gt;</text>
  <path class="ln2" d="M 302 94 H 320" marker-end="url(#b)"/>
  <rect class="chip" x="320" y="78" width="150" height="32" rx="5"/>
  <text class="s" x="395" y="98" text-anchor="middle">CommandParser</text>
  <path class="ln2" d="M 470 94 H 488" marker-end="url(#b)"/>
  <rect class="chip" x="488" y="78" width="196" height="32" rx="5"/>
  <text class="s" x="586" y="98" text-anchor="middle">AUTH + snapshot gates</text>
  <path class="ln2" d="M 684 94 H 702" marker-end="url(#b)"/>
  <rect class="chip" x="702" y="78" width="152" height="32" rx="5"/>
  <text class="s" x="778" y="98" text-anchor="middle">write gate (exclusive)</text>

  <path class="ln2" d="M 170 124 V 148" marker-end="url(#b)"/>

  <rect class="grp" x="24" y="148" width="852" height="152" rx="8"/>
  <text class="lbl" x="38" y="168">PREPARE</text>
  <text class="s" x="236" y="168">EventStore::PrepareEvent — validate, then probe the dedup caches without committing</text>
  <rect class="alt" x="38" y="178" width="170" height="32" rx="5"/>
  <text class="s" x="123" y="198" text-anchor="middle">resolve timestamp</text>
  <path class="ln2" d="M 208 194 H 226" marker-end="url(#b)"/>
  <rect class="alt" x="226" y="178" width="180" height="32" rx="5"/>
  <text class="s" x="316" y="198" text-anchor="middle">DEL: score forced to 0</text>
  <path class="ln2" d="M 406 194 H 424" marker-end="url(#b)"/>
  <rect class="alt" x="424" y="178" width="190" height="32" rx="5"/>
  <text class="s" x="519" y="198" text-anchor="middle">EventValidator::Validate</text>
  <rect class="alt" x="38" y="224" width="252" height="46" rx="5"/>
  <text class="s" x="164" y="243" text-anchor="middle">ADD — DedupCache</text>
  <text class="s" x="164" y="258" text-anchor="middle">same key inside the time window</text>
  <rect class="alt" x="302" y="224" width="252" height="46" rx="5"/>
  <text class="s" x="428" y="243" text-anchor="middle">SET — StateCache</text>
  <text class="s" x="428" y="258" text-anchor="middle">same last value for the id</text>
  <rect class="alt" x="566" y="224" width="252" height="46" rx="5"/>
  <text class="s" x="692" y="243" text-anchor="middle">DEL — StateCache</text>
  <text class="s" x="692" y="258" text-anchor="middle">already marked deleted</text>
  <text class="s" x="38" y="288">a duplicate stops here: no WAL record, no ring-buffer push, no co-occurrence update — the reply is still OK</text>

  <path class="ln2" d="M 170 300 V 324" marker-end="url(#b)"/>

  <rect class="grp" x="24" y="324" width="852" height="82" rx="8"/>
  <text class="lbl" x="38" y="344">DURABILITY</text>
  <text class="s warnt" x="236" y="344">WAL first — the record is accepted before any store is touched</text>
  <rect class="chip" x="38" y="354" width="190" height="32" rx="5"/>
  <text class="s" x="133" y="374" text-anchor="middle">EncodeCommand payload</text>
  <path class="ln2" d="M 228 370 H 246" marker-end="url(#b)"/>
  <rect class="chip" x="246" y="354" width="132" height="32" rx="5"/>
  <text class="s" x="312" y="374" text-anchor="middle">Wal::Append</text>
  <path class="ln2" d="M 378 370 H 396" marker-end="url(#b)"/>
  <rect class="chip" x="396" y="354" width="250" height="32" rx="5"/>
  <text class="s" x="521" y="374" text-anchor="middle">kEventAdd, or kEventDel for DEL</text>

  <path class="ln2" d="M 170 406 V 430" marker-end="url(#b)"/>

  <rect class="grp" x="24" y="430" width="852" height="134" rx="8"/>
  <text class="lbl" x="38" y="450">APPLY IN MEMORY</text>
  <text class="s" x="236" y="450">EventStore::AddEventAndGetPrior, then CoOccurrenceIndex::ApplyIngestedEvent</text>
  <rect class="alt" x="38" y="460" width="176" height="32" rx="5"/>
  <text class="s" x="126" y="480" text-anchor="middle">commit the dedup entry</text>
  <path class="ln2" d="M 214 476 H 232" marker-end="url(#b)"/>
  <rect class="alt" x="232" y="460" width="204" height="32" rx="5"/>
  <text class="s" x="334" y="480" text-anchor="middle">per-context ring buffer: Push</text>
  <path class="ln2" d="M 436 476 H 454" marker-end="url(#b)"/>
  <rect class="alt" x="454" y="460" width="182" height="32" rx="5"/>
  <text class="s" x="545" y="480" text-anchor="middle">snapshot the prior events</text>
  <path class="ln2" d="M 636 476 H 654" marker-end="url(#b)"/>
  <rect class="alt" x="654" y="460" width="152" height="32" rx="5"/>
  <text class="s" x="730" y="480" text-anchor="middle">co-occurrence update</text>
  <text class="s" x="38" y="512">every (new, prior) pair scores new × prior, with optional temporal decay by half-life</text>
  <text class="s" x="38" y="530">then prunes by <tspan class="mono">max_neighbors_per_item</tspan> and <tspan class="mono">min_support</tspan>; the index generation is bumped</text>
  <text class="s" x="38" y="548">a context beyond <tspan class="mono">max_contexts</tspan> is evicted LRU; DEL with <tspan class="mono">negative_signals</tspan> also dampens the removed item's edges</text>

  <path class="ln2" d="M 170 564 V 588" marker-end="url(#b)"/>

  <rect class="grp" x="24" y="588" width="852" height="94" rx="8"/>
  <text class="lbl" x="38" y="608">INVALIDATE AND REPLY</text>
  <text class="s" x="236" y="608">the cache is pruned selectively, by the item the event named</text>
  <rect class="chip" x="38" y="618" width="240" height="32" rx="5"/>
  <text class="s" x="158" y="638" text-anchor="middle">SimilarityCache::InvalidateByItemId</text>
  <path class="ln2" d="M 278 634 H 296" marker-end="url(#b)"/>
  <rect class="chip" x="296" y="618" width="106" height="32" rx="5"/>
  <text class="mono" x="349" y="638" text-anchor="middle">OK EVENT</text>
  <text class="s" x="38" y="672">SIM cache keys also carry the co-occurrence generation, so the update invalidates matching entries</text>

  <text class="s" x="450" y="706" text-anchor="middle">During WAL replay the append is skipped, so a replayed EVENT re-applies to memory without re-logging.</text>
</svg>
