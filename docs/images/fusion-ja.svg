<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 816" width="900" height="816" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">2 つのスコアリストが 1 つの順位になるまで</title>
  <desc id="dsc">1 つのクエリ項目に対する統合スコアの計算例です。共起側とベクトル側がそれぞれ独自の候補リストを返し、各リストは min–max で 0 から 1 の範囲に個別に正規化されるため、リスト内の最上位が 1、最下位が 0 になります。正規化した 2 つのリストは積ではなく和として重ね合わせられ、ベクトル側の重み α と共起側の重み β による加重和で順位が決まります。最後の枠では適応的な重みを示しており、クエリ項目の共起近傍が増えるほど α が上限から下限へ移ります。</desc>

  <style>
    .bg    { fill:#f7f5f1 }
    .chip  { fill:#ffffff; stroke:#d7d4cd }
    .card  { fill:#ffffff; stroke:#3f6b8a }
    .alt   { fill:#ffffff; stroke:#8a6a1f }
    .rule  { fill:none; stroke:#b8b4ac; stroke-width:1 }
    .ln    { fill:none; stroke:#3f6b8a; stroke-width:1.4 }
    .ln2   { fill:none; stroke:#8a6a1f; stroke-width:1.4 }
    .lnn   { fill:none; stroke:#b8b4ac; stroke-width:1.4 }
    .ah    { fill:#3f6b8a }
    .ah2   { fill:#8a6a1f }
    .ahn   { fill:#b8b4ac }
    text   { font-family:Inter,"Helvetica Neue","Hiragino Sans","Noto Sans JP",Arial,sans-serif; fill:#1f2328 }
    .lbl   { font-size:11px; fill:#6e7781; letter-spacing:.06em }
    .s     { font-size:10.5px; fill:#6e7781 }
    .mono  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#3f6b8a }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117}
      .chip{fill:#161b22;stroke:#30363d} .card{fill:#161b22;stroke:#7fb3d5} .alt{fill:#161b22;stroke:#d9b45c}
      .rule{stroke:#484f58}
      .ln{stroke:#7fb3d5} .ln2{stroke:#d9b45c} .lnn{stroke:#484f58}
      .ah{fill:#7fb3d5} .ah2{fill:#d9b45c} .ahn{fill:#484f58}
      .mono{fill:#7fb3d5}
      text{fill:#e6edf3} .lbl{fill:#8b949e} .s{fill:#8b949e}
    }
  </style>

  <defs>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="c" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ahn" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="900" height="816" rx="12"/>

  <rect class="chip" x="300" y="24" width="300" height="32" rx="6"/>
  <text class="mono" x="450" y="44" text-anchor="middle">SIM item42 3 using=fusion</text>

  <path class="lnn" d="M 450 56 V 68"/>
  <path class="rule" d="M 243 68 H 657"/>
  <path class="ln2" d="M 243 68 V 88" marker-end="url(#b)"/>
  <path class="ln" d="M 657 68 V 88" marker-end="url(#a)"/>

  <rect class="alt" x="48" y="88" width="390" height="152" rx="8"/>
  <text class="lbl" x="64" y="110">共起スコア</text>
  <text class="s" x="64" y="132">item</text>
  <text class="s" x="250" y="132" text-anchor="end">生スコア</text>
  <text class="s" x="418" y="132" text-anchor="end">[0, 1] に正規化</text>
  <path class="rule" d="M 64 140 H 422"/>
  <text class="mono" x="64" y="159">itemB</text>
  <text class="mono" x="250" y="159" text-anchor="end">180</text>
  <text class="mono" x="418" y="159" text-anchor="end">1.00</text>
  <text class="mono" x="64" y="179">itemD</text>
  <text class="mono" x="250" y="179" text-anchor="end">120</text>
  <text class="mono" x="418" y="179" text-anchor="end">0.50</text>
  <text class="mono" x="64" y="199">itemE</text>
  <text class="mono" x="250" y="199" text-anchor="end">60</text>
  <text class="mono" x="418" y="199" text-anchor="end">0.00</text>
  <text class="s" x="64" y="225">min–max: (生スコア − 60) / 120</text>

  <rect class="card" x="462" y="88" width="390" height="152" rx="8"/>
  <text class="lbl" x="478" y="110">ベクトル類似度</text>
  <text class="s" x="478" y="132">item</text>
  <text class="s" x="664" y="132" text-anchor="end">コサイン</text>
  <text class="s" x="832" y="132" text-anchor="end">[0, 1] に正規化</text>
  <path class="rule" d="M 478 140 H 836"/>
  <text class="mono" x="478" y="159">itemC</text>
  <text class="mono" x="664" y="159" text-anchor="end">0.94</text>
  <text class="mono" x="832" y="159" text-anchor="end">1.00</text>
  <text class="mono" x="478" y="179">itemB</text>
  <text class="mono" x="664" y="179" text-anchor="end">0.86</text>
  <text class="mono" x="832" y="179" text-anchor="end">0.60</text>
  <text class="mono" x="478" y="199">itemD</text>
  <text class="mono" x="664" y="199" text-anchor="end">0.74</text>
  <text class="mono" x="832" y="199" text-anchor="end">0.00</text>
  <text class="s" x="478" y="225">min–max: (cos − 0.74) / 0.20</text>

  <path class="ln2" d="M 243 240 V 272" marker-end="url(#b)"/>
  <path class="ln" d="M 657 240 V 272" marker-end="url(#a)"/>

  <rect class="chip" x="48" y="272" width="804" height="84" rx="8"/>
  <text class="lbl" x="64" y="294">統合</text>
  <text class="mono" x="124" y="294">score = α × vector + β × co-occurrence</text>
  <text class="mono" x="64" y="318">α = similarity.fusion_alpha = 0.6</text>
  <text class="mono" x="440" y="318">β = similarity.fusion_beta = 0.4</text>
  <text class="s" x="64" y="338">片方のソースがリストごと空なら重みを外し、残る側が 1 を受け持つ。それ以外は α と β の和が 1 になるよう調整</text>

  <path class="lnn" d="M 450 356 V 388" marker-end="url(#c)"/>

  <rect class="chip" x="48" y="388" width="804" height="174" rx="8"/>
  <text class="lbl" x="64" y="410">統合ランキング</text>
  <text class="s" x="64" y="432">item</text>
  <text class="s" x="260" y="432" text-anchor="end">共起</text>
  <text class="s" x="400" y="432" text-anchor="end">ベクトル</text>
  <text class="s" x="440" y="432">0.6 × ベクトル + 0.4 × 共起</text>
  <text class="s" x="836" y="432" text-anchor="end">統合スコア</text>
  <path class="rule" d="M 64 440 H 836"/>
  <text class="mono" x="64" y="459">itemB</text>
  <text class="mono" x="260" y="459" text-anchor="end">1.00</text>
  <text class="mono" x="400" y="459" text-anchor="end">0.60</text>
  <text class="mono" x="440" y="459">0.6 × 0.60 + 0.4 × 1.00</text>
  <text class="mono" x="836" y="459" text-anchor="end">0.76</text>
  <text class="mono" x="64" y="479">itemC</text>
  <text class="mono" x="260" y="479" text-anchor="end">—</text>
  <text class="mono" x="400" y="479" text-anchor="end">1.00</text>
  <text class="mono" x="440" y="479">0.6 × 1.00 + 0.4 × 0</text>
  <text class="mono" x="836" y="479" text-anchor="end">0.60</text>
  <text class="mono" x="64" y="499">itemD</text>
  <text class="mono" x="260" y="499" text-anchor="end">0.50</text>
  <text class="mono" x="400" y="499" text-anchor="end">0.00</text>
  <text class="mono" x="440" y="499">0.6 × 0.00 + 0.4 × 0.50</text>
  <text class="mono" x="836" y="499" text-anchor="end">0.20</text>
  <text class="mono" x="64" y="519">itemE</text>
  <text class="mono" x="260" y="519" text-anchor="end">0.00</text>
  <text class="mono" x="400" y="519" text-anchor="end">—</text>
  <text class="mono" x="440" y="519">0.6 × 0 + 0.4 × 0.00</text>
  <text class="mono" x="836" y="519" text-anchor="end">0.00</text>
  <text class="s" x="64" y="545">— はそのリストに無い項目で、寄与は 0。両方のリストに現れる itemB が首位、itemC はベクトル側だけで順位に入る</text>

  <rect class="chip" x="48" y="594" width="804" height="176" rx="8"/>
  <text class="lbl" x="64" y="616">適応的な重み</text>
  <text class="mono" x="196" y="616">similarity.adaptive_fusion</text>
  <text class="mono" x="64" y="640">α = adaptive_max_alpha − min(1, n / adaptive_maturity_threshold) × (adaptive_max_alpha − adaptive_min_alpha)</text>
  <text class="mono" x="64" y="658">β = 1 − α</text>
  <text class="s" x="152" y="658">n = クエリ項目の共起近傍数</text>
  <text class="mono" x="64" y="678">adaptive_max_alpha = 0.9 · adaptive_min_alpha = 0.2 · adaptive_maturity_threshold = 50</text>

  <rect class="chip" x="64" y="696" width="248" height="54" rx="5"/>
  <text class="mono" x="80" y="716">n = 5   →  α 0.83, β 0.17</text>
  <text class="s" x="80" y="734">新しい項目: ベクトル側が優勢</text>

  <rect class="chip" x="328" y="696" width="248" height="54" rx="5"/>
  <text class="mono" x="344" y="716">n = 25  →  α 0.55, β 0.45</text>
  <text class="s" x="344" y="734">中間: 両者が拮抗</text>

  <rect class="chip" x="592" y="696" width="244" height="54" rx="5"/>
  <text class="mono" x="608" y="716">n ≥ 50  →  α 0.20, β 0.80</text>
  <text class="s" x="608" y="734">成熟した項目: 共起側が優勢</text>

  <text class="s" x="450" y="794" text-anchor="middle">2 つのリストは積ではなく和で扱われるため、片方にしか現れない候補も、欠けている側を 0 として順位に入ります。</text>
</svg>
