<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 404" width="960" height="404" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Two signals, one ranked answer</title>
  <desc id="dsc">An application writes two independent signals into a single nvecd process. EVENT records what happened and feeds an event store and a co-occurrence index; VECSET records what an item looks like and feeds a vector store and an ANN index. A SIM or SIMV query is answered from the similarity cache when the same question repeats, and otherwise by the similarity engine, which can rank by events alone, by vectors alone, or by a weighted fusion of the two. The answer goes back to the application as a ranked list of item and score.</desc>

  <style>
    .bg    { fill:#f7f5f1 }
    .grp   { fill:#edeae4 }
    .chip  { fill:#ffffff; stroke:#d7d4cd }
    .card  { fill:#ffffff; stroke:#3f6b8a }
    .alt   { fill:#ffffff; stroke:#8a6a1f }
    .ln    { fill:none; stroke:#3f6b8a; stroke-width:1.4 }
    .ln2   { fill:none; stroke:#8a6a1f; stroke-width:1.4 }
    .lnn   { fill:none; stroke:#b8b4ac; stroke-width:1.4 }
    .lnq   { fill:none; stroke:#b8b4ac; stroke-width:1.4; stroke-dasharray:5 4 }
    .ah    { fill:#3f6b8a }
    .ah2   { fill:#8a6a1f }
    .ahn   { fill:#b8b4ac }
    text   { font-family:Inter,"Helvetica Neue","Hiragino Sans","Noto Sans JP",Arial,sans-serif; fill:#1f2328 }
    .h     { font-size:12.5px }
    .lbl   { font-size:11px; fill:#6e7781; letter-spacing:.06em }
    .s     { font-size:10.5px; fill:#6e7781 }
    .mono  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#3f6b8a }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117} .grp{fill:#12171d}
      .chip{fill:#161b22;stroke:#30363d} .card{fill:#161b22;stroke:#7fb3d5} .alt{fill:#161b22;stroke:#d9b45c}
      .ln{stroke:#7fb3d5} .ln2{stroke:#d9b45c} .lnn{stroke:#484f58} .lnq{stroke:#484f58}
      .ah{fill:#7fb3d5} .ah2{fill:#d9b45c} .ahn{fill:#484f58}
      .mono{fill:#7fb3d5}
      text{fill:#e6edf3} .lbl{fill:#8b949e} .s{fill:#8b949e}
    }
  </style>

  <defs>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="c" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ahn" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="404" rx="12"/>

  <rect class="chip" x="380" y="14" width="176" height="52" rx="6"/>
  <text class="h" x="468" y="36" text-anchor="middle">SimilarityCache</text>
  <text class="s" x="468" y="54" text-anchor="middle">a repeat query is free</text>

  <path class="lnn" d="M 92 92 V 30 H 380" marker-end="url(#c)"/>
  <text class="mono" x="200" y="24">SIM / SIMV</text>

  <path class="lnq" d="M 380 54 H 124 V 92" marker-end="url(#c)"/>
  <text class="s" x="200" y="70">cache hit</text>

  <path class="lnn" d="M 556 30 H 736 V 92" marker-end="url(#c)"/>
  <text class="s" x="600" y="24">miss</text>

  <rect class="chip" x="24" y="92" width="136" height="224" rx="8"/>
  <text class="lbl" x="38" y="118">APPLICATION</text>
  <text class="s" x="38" y="148">writes what</text>
  <text class="s" x="38" y="164">happened, and</text>
  <text class="s" x="38" y="180">what items</text>
  <text class="s" x="38" y="196">look like</text>
  <text class="s" x="38" y="236">then asks for the</text>
  <text class="s" x="38" y="252">neighbours of</text>
  <text class="s" x="38" y="268">one item</text>

  <rect class="grp" x="224" y="92" width="380" height="104" rx="8"/>
  <text class="lbl" x="240" y="114">EVENT SIGNAL</text>
  <rect class="alt" x="240" y="126" width="156" height="56" rx="6"/>
  <text class="h" x="318" y="150" text-anchor="middle">EventStore</text>
  <text class="s" x="318" y="168" text-anchor="middle">per-context history</text>
  <rect class="alt" x="432" y="126" width="156" height="56" rx="6"/>
  <text class="h" x="510" y="150" text-anchor="middle">CoOccurrenceIndex</text>
  <text class="s" x="510" y="168" text-anchor="middle">items seen together</text>

  <rect class="grp" x="224" y="212" width="380" height="104" rx="8"/>
  <text class="lbl" x="240" y="234">VECTOR SIGNAL</text>
  <rect class="card" x="240" y="246" width="156" height="56" rx="6"/>
  <text class="h" x="318" y="270" text-anchor="middle">VectorStore</text>
  <text class="s" x="318" y="288" text-anchor="middle">one vector per item</text>
  <rect class="card" x="432" y="246" width="156" height="56" rx="6"/>
  <text class="h" x="510" y="270" text-anchor="middle">AnnIndex</text>
  <text class="s" x="510" y="288" text-anchor="middle">flat / HNSW / IVF</text>

  <path class="ln2" d="M 160 154 H 240" marker-end="url(#b)"/>
  <text class="mono" x="172" y="148">EVENT</text>
  <path class="ln" d="M 160 274 H 240" marker-end="url(#a)"/>
  <text class="mono" x="172" y="268">VECSET</text>

  <path class="ln2" d="M 396 154 H 432" marker-end="url(#b)"/>
  <path class="ln" d="M 396 274 H 432" marker-end="url(#a)"/>

  <path class="ln2" d="M 588 154 H 648" marker-end="url(#b)"/>
  <path class="ln" d="M 588 274 H 648" marker-end="url(#a)"/>

  <rect class="card" x="648" y="92" width="176" height="224" rx="8"/>
  <text class="lbl" x="664" y="118">SEARCH</text>
  <text class="h" x="664" y="142">SimilarityEngine</text>
  <text class="s" x="664" y="164">merges both signals</text>
  <text class="s" x="664" y="180">into one ranking</text>
  <text class="lbl" x="664" y="210">SIM MODE</text>
  <rect class="chip" x="664" y="220" width="144" height="24" rx="5"/>
  <text class="mono" x="736" y="236" text-anchor="middle">events</text>
  <rect class="chip" x="664" y="250" width="144" height="24" rx="5"/>
  <text class="mono" x="736" y="266" text-anchor="middle">vectors</text>
  <rect class="chip" x="664" y="280" width="144" height="24" rx="5"/>
  <text class="mono" x="736" y="296" text-anchor="middle">fusion</text>

  <path class="lnn" d="M 824 204 H 880 V 348 H 132 V 316" marker-end="url(#c)"/>
  <text class="s" x="506" y="340" text-anchor="middle">a ranked list of item and score</text>

  <text class="s" x="480" y="384" text-anchor="middle">The two signals are independent: an item can be found by its events, by its vector, or by both.</text>
</svg>
