<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 900" width="960" height="900" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">fusion モードの SIM クエリが返るまで</title>
  <desc id="dsc">fusion モードの SIM クエリを上から下へたどった読み取り経路です。リクエストはクエリ引数と 4 つの世代番号からなるキャッシュキーに変換され、参照はヒットして保存済みの上位 k 件を展開するか、ミスします。ミスした場合は共起検索とベクトル検索の 2 系統が top_k の 3 倍まで候補を取得し、各ソースを min–max で 0 から 1 に正規化してから重み付きで統合します。統合後にメタデータフィルタを再適用して top_k 件に切り詰め、クエリコストが閾値を超えたときだけキャッシュへ書き戻します。min_score の下限はヒット経路とミス経路の両方で最後に適用されます。</desc>

  <style>
    .bg    { fill:#f7f5f1 }
    .grp   { fill:#edeae4 }
    .chip  { fill:#ffffff; stroke:#d7d4cd }
    .card  { fill:#ffffff; stroke:#3f6b8a }
    .alt   { fill:#ffffff; stroke:#8a6a1f }
    .ln    { fill:none; stroke:#3f6b8a; stroke-width:1.4 }
    .ln2   { fill:none; stroke:#8a6a1f; stroke-width:1.4 }
    .lnn   { fill:none; stroke:#b8b4ac; stroke-width:1.4 }
    .lnq   { fill:none; stroke:#b8b4ac; stroke-width:1.4; stroke-dasharray:5 4 }
    .ah    { fill:#3f6b8a }
    .ah2   { fill:#8a6a1f }
    .ahn   { fill:#b8b4ac }
    text   { font-family:Inter,"Helvetica Neue","Hiragino Sans","Noto Sans JP",Arial,sans-serif; fill:#1f2328 }
    .h     { font-size:12.5px }
    .lbl   { font-size:11px; fill:#6e7781; letter-spacing:.06em }
    .s     { font-size:10.5px; fill:#6e7781 }
    .mono  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#3f6b8a }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117} .grp{fill:#12171d}
      .chip{fill:#161b22;stroke:#30363d} .card{fill:#161b22;stroke:#7fb3d5} .alt{fill:#161b22;stroke:#d9b45c}
      .ln{stroke:#7fb3d5} .ln2{stroke:#d9b45c} .lnn{stroke:#484f58} .lnq{stroke:#484f58}
      .ah{fill:#7fb3d5} .ah2{fill:#d9b45c} .ahn{fill:#484f58}
      .mono{fill:#7fb3d5}
      text{fill:#e6edf3} .lbl{fill:#8b949e} .s{fill:#8b949e}
    }
  </style>

  <defs>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="c" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ahn" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="900" rx="12"/>

  <rect class="chip" x="260" y="44" width="440" height="56" rx="6"/>
  <text class="mono" x="276" y="68">SIM item42 10 using=fusion filter=genre:jazz min_score=0.2</text>
  <text class="s" x="276" y="86">top_k = 10、filter 式は MetadataFilter に変換</text>

  <path class="lnn" d="M 480 100 V 118" marker-end="url(#c)"/>

  <rect class="chip" x="260" y="118" width="440" height="72" rx="6"/>
  <text class="lbl" x="276" y="140">キャッシュキー</text>
  <text class="s" x="276" y="159">id ・ top_k ・ mode ・ adaptive ・ filter 式</text>
  <text class="s" x="276" y="176">co-occurrence ・ vector ・ metadata ・ dataset の各世代番号</text>

  <path class="lnn" d="M 480 190 V 212" marker-end="url(#c)"/>

  <rect class="chip" x="280" y="212" width="400" height="50" rx="6"/>
  <text class="h" x="480" y="234" text-anchor="middle">キャッシュ参照</text>
  <text class="s" x="480" y="250" text-anchor="middle">検索種別ごと: item ・ vector ・ filtered</text>

  <path class="lnn" d="M 680 237 H 804 V 288" marker-end="url(#c)"/>
  <text class="s" x="692" y="230">ヒット</text>

  <path class="lnn" d="M 480 262 V 300" marker-end="url(#c)"/>
  <text class="s" x="490" y="284">ミス</text>

  <rect class="chip" x="708" y="288" width="192" height="72" rx="6"/>
  <text class="lbl" x="724" y="310">キャッシュヒット</text>
  <text class="s" x="724" y="329">保存済みの top-k を</text>
  <text class="s" x="724" y="345">展開 (LZ4)</text>

  <path class="lnn" d="M 804 360 V 754 H 700" marker-end="url(#c)"/>

  <rect class="grp" x="260" y="300" width="440" height="186" rx="8"/>
  <text class="lbl" x="276" y="321">候補取得</text>
  <text class="mono" x="336" y="321">fetch_k = min(top_k × 3, similarity.max_top_k)</text>

  <rect class="alt" x="276" y="332" width="196" height="84" rx="6"/>
  <text class="lbl" x="290" y="353">共起</text>
  <text class="mono" x="290" y="372">GetSimilar(id, fetch_k)</text>
  <text class="s" x="290" y="390">クエリ項目の近傍</text>
  <text class="s" x="290" y="405">メタデータで絞り込み</text>

  <rect class="card" x="488" y="332" width="196" height="84" rx="6"/>
  <text class="lbl" x="502" y="353">ベクトル検索</text>
  <text class="mono" x="502" y="372">AnnIndex::Search</text>
  <text class="s" x="502" y="390">HNSW / IVF による近似探索</text>
  <text class="s" x="502" y="405">flat なら全件走査</text>

  <path class="ln2" d="M 374 416 V 436" marker-end="url(#b)"/>
  <path class="ln" d="M 586 416 V 436" marker-end="url(#a)"/>

  <rect class="chip" x="276" y="436" width="408" height="34" rx="5"/>
  <text class="s" x="480" y="457" text-anchor="middle">各ソースを min–max で [0, 1] に正規化</text>

  <path class="lnn" d="M 480 486 V 506" marker-end="url(#c)"/>

  <rect class="chip" x="260" y="506" width="440" height="92" rx="6"/>
  <text class="lbl" x="276" y="528">重み付き統合</text>
  <text class="mono" x="276" y="548">score = α × vector + β × co-occurrence</text>
  <text class="mono" x="276" y="565">similarity.fusion_alpha / similarity.fusion_beta</text>
  <text class="s" x="276" y="583">または近傍数から算出する適応的な重み</text>

  <path class="lnn" d="M 480 598 V 618" marker-end="url(#c)"/>

  <rect class="chip" x="260" y="618" width="440" height="72" rx="6"/>
  <text class="lbl" x="276" y="640">絞り込みと上位抽出</text>
  <text class="s" x="276" y="659">統合後の候補にメタデータフィルタを再適用し、</text>
  <text class="s" x="276" y="675">部分ソートして top_k 件に切り詰める</text>

  <rect class="chip" x="56" y="618" width="184" height="92" rx="6"/>
  <text class="lbl" x="72" y="640">キャッシュ書き込み</text>
  <text class="s" x="72" y="659">クエリコストが</text>
  <text class="s" x="72" y="675">閾値を超えたときだけ</text>
  <text class="mono" x="72" y="694">cache.min_query_cost_ms</text>

  <path class="lnq" d="M 260 654 H 240" marker-end="url(#c)"/>

  <path class="lnn" d="M 480 690 V 718" marker-end="url(#c)"/>

  <rect class="chip" x="260" y="718" width="440" height="72" rx="6"/>
  <text class="lbl" x="276" y="740">スコア下限</text>
  <text class="mono" x="346" y="740">min_score</text>
  <text class="s" x="276" y="759">上位 k 件の選択後とキャッシュ書き込み後に適用され、</text>
  <text class="s" x="276" y="775">キャッシュキーには含まれない</text>

  <path class="lnn" d="M 480 790 V 814" marker-end="url(#c)"/>

  <rect class="chip" x="260" y="814" width="440" height="42" rx="6"/>
  <text class="lbl" x="276" y="840">レスポンス</text>
  <text class="s" x="350" y="840">順位付けされた (item_id, score) の組</text>

  <text class="s" x="480" y="882" text-anchor="middle">キャッシュキーは共起・ベクトル・メタデータ・データセットの各世代番号を含むため、書き込みは走査なしで該当エントリを無効化します。</text>
</svg>
