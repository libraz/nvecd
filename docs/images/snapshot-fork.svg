<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 990" width="960" height="990" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">How a fork-based snapshot is written and made durable</title>
  <desc id="dsc">Two process lanes with time running downward. The parent lane shows the trigger, the store lock barrier under which the WAL sequence is captured, the fork, the immediate release of all four locks, and the durability handshake that follows the child's exit. The fork child lane shows the child resetting its inherited locks, closing descriptors, resetting signal handlers, serializing the stores and exiting. A bracket on the left marks that the parent holds the locks only from the barrier to the fork, and a band at the bottom shows the three files on disk: the snapshot, its checkpoint sidecar and the write-ahead log.</desc>

  <style>
    .bg    { fill:#f7f5f1 }
    .grp   { fill:#edeae4 }
    .chip  { fill:#ffffff; stroke:#d7d4cd }
    .seam  { fill:none; stroke:#b8b4ac; stroke-dasharray:6 5 }
    .rule  { fill:none; stroke:#b8b4ac; stroke-width:1 }
    .ln    { fill:none; stroke:#3f6b8a; stroke-width:1.4 }
    .ah    { fill:#3f6b8a }
    text   { font-family:Inter,"Helvetica Neue","Hiragino Sans","Noto Sans JP",Arial,sans-serif; fill:#1f2328 }
    .h     { font-size:12.5px }
    .lbl   { font-size:11px; fill:#6e7781; letter-spacing:.06em }
    .s     { font-size:10.5px; fill:#6e7781 }
    .mono  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#3f6b8a }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117} .grp{fill:#12171d}
      .chip{fill:#161b22;stroke:#30363d}
      .seam{stroke:#484f58} .rule{stroke:#484f58}
      .ln{stroke:#7fb3d5} .ah{fill:#7fb3d5} .mono{fill:#7fb3d5}
      text{fill:#e6edf3} .lbl{fill:#8b949e} .s{fill:#8b949e}
    }
  </style>

  <defs>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="990" rx="12"/>

  <rect class="grp" x="36" y="32" width="436" height="778" rx="8"/>
  <rect class="grp" x="496" y="32" width="432" height="656" rx="8"/>
  <text class="lbl" x="52" y="52">PARENT PROCESS</text>
  <text class="lbl" x="512" y="52">FORK CHILD</text>

  <path class="rule" d="M 28 134 H 18 V 374 H 28"/>
  <text class="lbl" x="13" y="254" text-anchor="middle" transform="rotate(-90 13 254)">held only from the barrier to fork()</text>

  <rect class="chip" x="52" y="66" width="404" height="52" rx="6"/>
  <text class="h" x="64" y="88">Snapshot requested</text>
  <text class="mono" x="64" y="106">DUMP SAVE</text>
  <text class="s" x="129" y="106">or the auto-snapshot scheduler interval</text>

  <rect class="chip" x="52" y="134" width="404" height="76" rx="6"/>
  <text class="h" x="64" y="156">Store lock barrier</text>
  <text class="s" x="64" y="178">shared read lock on EventStore, CoOccurrenceIndex,</text>
  <text class="s" x="64" y="194">VectorStore and MetadataStore, all held at once</text>

  <rect class="chip" x="52" y="226" width="404" height="58" rx="6"/>
  <text class="h" x="64" y="248">Capture the WAL sequence</text>
  <text class="s" x="64" y="270">taken under the barrier, so it is the newest op the image holds</text>

  <rect class="chip" x="52" y="300" width="404" height="58" rx="6"/>
  <text class="h" x="64" y="322">Flush the logger, then</text>
  <text class="mono" x="196" y="322">fork()</text>
  <text class="s" x="64" y="344">the child inherits a copy-on-write image of every store</text>

  <path class="ln" d="M 456 334 H 512" marker-end="url(#a)"/>

  <rect class="chip" x="52" y="374" width="404" height="58" rx="6"/>
  <text class="h" x="64" y="396">Release all four locks and resume serving</text>
  <text class="s" x="64" y="418">the hold ends here — the writing happens in the child</text>

  <rect class="chip" x="52" y="448" width="404" height="76" rx="6"/>
  <text class="h" x="64" y="470">SnapshotSession adopts the child</text>
  <text class="s" x="64" y="492">one completion thread performs the only waitpid() for that pid,</text>
  <text class="s" x="64" y="508">so the handshake has an owner with or without a caller</text>

  <path class="seam" d="M 120 536 V 690"/>
  <text class="s" x="140" y="600">the parent keeps serving requests</text>
  <text class="s" x="140" y="616">while the child writes</text>

  <rect class="chip" x="52" y="700" width="404" height="96" rx="6"/>
  <text class="h" x="64" y="722">Durability handshake, once the child has exited</text>
  <text class="s" x="64" y="744">write the checkpoint sidecar and fsync it,</text>
  <text class="s" x="64" y="760">then truncate the WAL up to the captured sequence</text>
  <text class="s" x="64" y="776">a failed child: reclaim its temporary, leave the WAL alone</text>

  <text class="s" x="712" y="170" text-anchor="middle">no child exists until the fork above</text>

  <rect class="chip" x="512" y="306" width="400" height="58" rx="6"/>
  <text class="h" x="524" y="328">Reset every inherited store lock</text>
  <text class="s" x="524" y="350">the parent's waiting-writer state would deadlock it</text>

  <rect class="chip" x="512" y="380" width="400" height="58" rx="6"/>
  <text class="h" x="524" y="402">Close inherited descriptors (fd 3 and up)</text>
  <text class="s" x="524" y="424">server sockets and the parent's log sinks</text>

  <rect class="chip" x="512" y="454" width="400" height="58" rx="6"/>
  <text class="h" x="524" y="476">Reset signal handlers</text>
  <text class="mono" x="524" y="498">SIGCHLD, SIGPIPE, SIGTERM</text>
  <text class="s" x="690" y="498">back to the default</text>

  <rect class="chip" x="512" y="528" width="400" height="76" rx="6"/>
  <text class="h" x="524" y="550">Serialize every store to a temporary file</text>
  <text class="s" x="524" y="572">logging suppressed; the child never re-enters spdlog</text>
  <text class="s" x="524" y="588">the image is frozen — later parent writes are not in it</text>

  <rect class="chip" x="512" y="620" width="300" height="58" rx="6"/>
  <text class="h" x="524" y="642">Exit immediately</text>
  <text class="s" x="524" y="664">code 0 on success, 1 on failure</text>

  <path class="ln" d="M 512 649 H 300 V 700" marker-end="url(#a)"/>
  <text class="s" x="340" y="641">exit status</text>

  <path class="ln" d="M 860 604 V 862" marker-end="url(#a)"/>
  <path class="ln" d="M 150 796 V 862" marker-end="url(#a)"/>
  <path class="ln" d="M 400 796 V 862" marker-end="url(#a)"/>

  <rect class="grp" x="36" y="830" width="892" height="128" rx="8"/>
  <text class="lbl" x="52" y="850">ON DISK</text>

  <rect class="chip" x="52" y="862" width="230" height="82" rx="6"/>
  <text class="h" x="64" y="884">checkpoint sidecar</text>
  <text class="mono" x="64" y="902">&lt;snapshot&gt;.walseq</text>
  <text class="s" x="64" y="920">the WAL sequence, plus the</text>
  <text class="s" x="64" y="936">snapshot size and CRC32</text>

  <rect class="chip" x="298" y="862" width="250" height="82" rx="6"/>
  <text class="h" x="310" y="884">write-ahead log</text>
  <text class="mono" x="310" y="902">wal-NNNNNN.log</text>
  <text class="s" x="310" y="920">truncated only after the sidecar</text>
  <text class="s" x="310" y="936">is durable, never before</text>

  <rect class="chip" x="564" y="862" width="348" height="82" rx="6"/>
  <text class="h" x="576" y="884">snapshot file</text>
  <text class="mono" x="576" y="902">auto_&lt;timestamp&gt;.nvec</text>
  <text class="s" x="576" y="920">written to a temporary, then published by rename</text>
  <text class="s" x="576" y="936">or the path given to</text>
  <text class="mono" x="690" y="936">DUMP SAVE</text>

  <text class="s" x="480" y="978" text-anchor="middle">Copy-on-write means the child's memory diverges from the parent's only as the parent writes; a mostly idle server pays almost nothing.</text>
</svg>
