# nvecd configuration example
#
# Generated from src/config/config-schema.json by support/generate_config_docs.py.
# Copy this file and edit it. Every option carries its default unless
# the comment says the value shown is an example instead.
#
# Reference: docs/en/configuration.md, docs/ja/configuration.md

# Event store and co-occurrence tracking configuration
events:
  # Number of events to track per context (ring buffer size) [10-10000]
  ctx_buffer_size: 50
  # Maximum active contexts retained by the LRU; least-recently-active contexts are pruned first (0 = unlimited) [0-1000000]
  max_contexts: 0
  # Maximum retained co-occurrence neighbors per item (0 = unlimited) [0-1000000]
  max_neighbors_per_item: 0
  # Prune co-occurrence edges with absolute score below this threshold (0 = disabled) [>= 0.0]
  min_support: 0.0
  # Decay interval in seconds (0 = disabled) [0-86400]
  decay_interval_sec: 3600
  # Decay factor [0.0-1.0]
  decay_alpha: 0.99
  # Deduplication time window in seconds (0 = disabled) [0-86400]
  dedup_window_sec: 60
  # Deduplication cache size (LRU); 0 = disable deduplication entirely, including the SET/DEL idempotency tracking [0-1000000]
  dedup_cache_size: 10000
  # Enable time-decay for co-occurrence updates
  temporal_cooccurrence: false
  # Half-life in seconds for temporal decay (score halves per this many seconds of age) [> 0.0]
  temporal_half_life_sec: 86400.0
  # Enable negative signal (down-ranking) on DEL events
  negative_signals: false
  # Reduction weight applied for negative signals [0.0-1.0]
  negative_weight: 0.5

# Vector store configuration
vectors:
  # Default vector dimension (number of features per vector) [1-4096]
  default_dimension: 768
  # Distance metric for similarity search [cosine dot l2]
  distance_metric: "cosine"

# Similarity search configuration
similarity:
  # Default number of results to return in similarity searches [1-10000]
  default_top_k: 100
  # Maximum number of results allowed in similarity searches [1-10000]
  max_top_k: 1000
  # Weight for the vector-similarity component in fusion mode [0.0-1.0]
  fusion_alpha: 0.6
  # Weight for the co-occurrence component in fusion mode [0.0-1.0]
  fusion_beta: 0.4
  # Random sampling size for approximate search; sampling engages only once the corpus exceeds twice this value (0 = exact search), and the maximum is the largest value whose doubling stays inside the 32-bit counter that comparison uses [0-2147483647]
  sample_size: 10000
  # Enable IVF (Inverted File) approximate nearest neighbor search
  ivf_enabled: false
  # Number of Voronoi cells/clusters for IVF index (0 = auto sqrt(n)) [0-65536]
  ivf_nlist: 256
  # Number of clusters to probe at query time [1-65536]
  ivf_nprobe: 8
  # Minimum number of vectors before auto-training IVF index; the maximum is the range of the type it is read into, not a tuning limit [1-4294967295]
  ivf_train_threshold: 10000
  # Seal the write buffer when it reaches this number of vectors; the maximum is the range of the type it is read into, not a tuning limit [1-4294967295]
  ivf_seal_threshold: 100000
  # Enable adaptive fusion weight computation based on item maturity
  adaptive_fusion: false
  # Minimum vector weight, used for mature items with many co-occurrences [0.0-1.0]
  adaptive_min_alpha: 0.2
  # Maximum vector weight, used for new items with few co-occurrences [0.0-1.0]
  adaptive_max_alpha: 0.9
  # Co-occurrence neighbor count at which an item is considered mature; the maximum is the range of the type it is read into, not a tuning limit [1-4294967295]
  adaptive_maturity_threshold: 50
  # ANN index type: hnsw, ivf, or flat (brute-force) [hnsw ivf flat]
  index_type: "flat"
  # HNSW number of connections per node; the maximum is the largest value whose doubled bottom-layer link count stays inside the 32-bit counter that holds it [2-2147483647]
  hnsw_m: 16
  # HNSW search width during construction; the maximum is the range of the type it is read into, not a tuning limit [1-4294967295]
  hnsw_ef_construction: 200
  # HNSW search width during query; the maximum is the range of the type it is read into, not a tuning limit [1-4294967295]
  hnsw_ef_search: 50
  # HNSW pre-allocated capacity (0 = dynamic growth); the value is reserved at startup and the maximum is the largest index the snapshot loader accepts, so reserving beyond it produces an index that cannot be reloaded [0-10000000]
  hnsw_max_elements: 0

# Snapshot persistence configuration
snapshot:
  # Snapshot directory path
  dir: "/var/lib/nvecd/snapshots"
  # Filename an argument-less DUMP SAVE writes inside the snapshot directory; validated like a client-supplied path, so an absolute or escaping name is refused (empty = fall back to a timestamped name). Must end in .nvec or .dmp, or startup will not treat the file as a recovery candidate
  default_filename: "nvecd.nvec"
  # Snapshot interval in seconds (0 = disabled) [0-86400]
  interval_sec: 0
  # Number of automatic snapshots to retain; manual snapshots are never removed (0 = keep every file) [0-100]
  retain: 3
  # Snapshot consistency mode: fork (COW, non-blocking) or lock (global write lock, blocking) [fork lock]
  mode: "fork"

# Performance and threading configuration
performance:
  # Worker thread pool size (0 = one worker per detected hardware thread) [0-128]
  thread_pool_size: 8
  # Maximum concurrent connections [1-100000]
  max_connections: 1000
  # Maximum connections per IP address (0 = unlimited) [0-100000]
  max_connections_per_ip: 100
  # Idle timeout, and the deadline for receiving the first complete request, in seconds [1-3600]
  connection_timeout_sec: 300
  # TCP receive buffer size in bytes [1024-1048576]
  recv_buffer_size: 4096
  # TCP send buffer size in bytes [1024-16777216]
  send_buffer_size: 65536
  # Maximum bytes accepted for a single request [1024-16777216]
  max_query_length: 1048576
  # Graceful shutdown timeout in milliseconds [100-60000]
  shutdown_timeout_ms: 5000
  # Process-wide cap for bytes buffered by the TCP reactor [1048576-1073741824]
  reactor_max_total_buffered_bytes: 268435456

# API server configuration
api:

  # TCP server configuration
  tcp:
    # TCP bind address ("0.0.0.0" listens on every interface)
    bind: "127.0.0.1"
    # TCP port [1-65535]
    port: 11017

  # HTTP server configuration
  http:
    # Enable HTTP server
    enable: false
    # HTTP bind address ("0.0.0.0" listens on every interface)
    bind: "127.0.0.1"
    # HTTP port [1-65535]
    port: 8080
    # Enable CORS headers
    enable_cors: false
    # Value for Access-Control-Allow-Origin header when CORS is enabled
    cors_allow_origin: ""
    # HTTP read/write timeout in seconds [1-300]
    timeout_sec: 5

  # Unix domain socket configuration
  unix_socket:
    # Unix socket path (empty string = disabled)
    path: ""

  # Rate limiting configuration (token bucket algorithm)
  rate_limiting:
    # Enable rate limiting
    enable: false
    # Maximum number of tokens per client (burst size) [1-10000]
    capacity: 100
    # Tokens added per second per client [1-1000]
    refill_rate: 10
    # Maximum number of tracked clients (for memory management) [10-100000]
    max_clients: 10000

# Network security configuration
network:
  # Allow CIDR list (empty = deny all)
  # Example value; the default is [].
  allow_cidrs:
    - "127.0.0.1/32"

# Logging configuration
logging:
  # Log level [trace debug info warn error]
  level: "info"
  # JSON format output
  json: true
  # Log file path (empty string = stdout, path = file output)
  file: ""

# Query cache configuration
cache:
  # Enable/disable cache
  enabled: true
  # Maximum cache memory in MB; the maximum is the range of the type it is read into, not a tuning limit [1-2147483647]
  max_memory_mb: 32
  # Minimum query cost to cache (ms) [>= 0.0]
  min_query_cost_ms: 10.0
  # Cache entry TTL (seconds, 0 = no TTL); the maximum is the range of the type it is read into, not a tuning limit [0-2147483647]
  ttl_seconds: 3600
  # Enable LZ4 compression
  compression_enabled: true
  # Number of entries to evict at once; the maximum is the range of the type it is read into, not a tuning limit [1-2147483647]
  eviction_batch_size: 10

# Security configuration
security:
  # Required password for write/admin commands (empty = no auth)
  requirepass: ""

# Write-Ahead Log configuration for crash recovery
wal:
  # Enable WAL-based crash recovery
  enabled: false
  # Directory holding WAL segment files
  dir: "/var/lib/nvecd/wal"
  # Maximum size per WAL file in bytes; the maximum is the largest integer the configuration reader carries, not a tuning limit [1-9223372036854775807]
  max_file_size: 67108864
  # fsync after every append (high durability, lower throughput); sync_interval_ms selects the batch interval when this is false
  sync_on_write: false
  # Batch fsync interval in milliseconds when sync_on_write is false (0 = fsync on every append); the maximum is the range of the type it is read into, not a tuning limit [0-4294967295]
  sync_interval_ms: 100
  # Persist vector bodies in VECSET WAL records; disable only when snapshots provide the required vector durability
  include_vectors: true
